<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DOM Practice</title>
</head>

<body>

<form id="registerForm">

    <input
        type="text"
        id="username"
        placeholder="Username"
    >

    <p id="usernameError"></p>

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <p id="emailError"></p>

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <p id="passwordError"></p>

    <button type="submit">Register</button>

</form>
    <script src="script.js"></script>

</body>
</html>
